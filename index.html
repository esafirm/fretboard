<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fretboard — Guitar Chord Library</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="site-header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">𝄞</span>
          <span class="logo-text">Fretboard</span>
        </div>
        <div class="header-controls">
          <button class="btn-icon" id="toggleTuning" title="Tuning">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
          </button>
          <div class="offline-badge" id="offlineBadge">
            <span class="dot"></span><span>Offline</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main layout -->
    <div class="main-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-section">
          <div class="section-label">Root Note</div>
          <div class="note-grid" id="noteGrid"></div>
        </div>
        <div class="sidebar-section">
          <div class="section-label">Chord Type</div>
          <div class="type-list" id="typeList"></div>
        </div>
        <div class="sidebar-section">
          <div class="section-label">Voicing</div>
          <div class="voicing-selector" id="voicingSelector"></div>
        </div>
      </aside>

      <!-- Main content -->
      <main class="main-content">
        <!-- Chord header -->
        <div class="chord-header">
          <div class="chord-title-group">
            <h1 class="chord-name" id="chordName">D7</h1>
            <div class="chord-meta" id="chordMeta">
              <span class="meta-item"><span class="meta-label">Name</span><span class="meta-value" id="chordFullName">Dominant seventh</span></span>
              <span class="meta-item"><span class="meta-label">Symbol</span><span class="meta-value" id="chordSymbol">7</span></span>
              <span class="meta-item"><span class="meta-label">Formula</span><span class="meta-value" id="chordFormula">1–3–5–♭7</span></span>
              <span class="meta-item"><span class="meta-label">Notes</span><span class="meta-value" id="chordNotes">D F♯ A C</span></span>
            </div>
          </div>
          <button class="play-btn" id="playBtn" title="Play chord">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
        </div>

        <!-- Fretboard diagram -->
        <div class="fretboard-wrap">
          <div class="fretboard-container">
            <canvas id="fretboard" width="900" height="200"></canvas>
          </div>
        </div>

        <!-- Position selector -->
        <div class="position-row">
          <span class="position-label">Position</span>
          <div class="position-dots" id="positionDots"></div>
        </div>

        <!-- Chord diagram grid -->
        <div class="diagram-section">
          <div class="diagram-grid" id="diagramGrid"></div>
        </div>

        <!-- Scale notes reference -->
        <div class="notes-reference" id="notesReference"></div>
      </main>
    </div>
  </div>

  <!-- Tuning panel -->
  <div class="tuning-panel" id="tuningPanel">
    <div class="panel-header">
      <span>Tuning</span>
      <button class="btn-close" id="closeTuning">✕</button>
    </div>
    <div class="tuning-options" id="tuningOptions"></div>
  </div>
  <div class="overlay" id="overlay"></div>

  <script src="chords-data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
